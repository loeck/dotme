<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#17232d" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#263641" stop-opacity=".07"/>
      <stop offset="1" stop-color="#263641" stop-opacity="0"/>
    </radialGradient>
    <filter id="ring-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="point-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <circle cx="20" cy="20" r="20" fill="url(#halo)"/>
  <circle cx="20" cy="20" r="12" fill="none" stroke="#263641" stroke-width="2.5" opacity=".45" filter="url(#ring-glow)"/>
  <circle cx="20" cy="20" r="12" fill="none" stroke="#17232d" stroke-width="1" opacity=".65"/>
  <circle cx="20" cy="20" r="2" fill="#17232d" filter="url(#point-glow)"/>
  <circle cx="20" cy="20" r="1.5" fill="#101a23"/>
</svg>
